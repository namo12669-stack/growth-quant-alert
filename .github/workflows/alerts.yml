name: Growth Alerts

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'demo = synthetic test; manual = live scan now; auto = respect market window'
        required: true
        default: demo
        type: choice
        options: [demo, manual, auto]
      dry_run:
        description: 'Only write reports; do not send Telegram or change alert history'
        type: boolean
        default: false
  schedule:
    - cron: '37 8 * * 1-5'
      timezone: America/New_York
    - cron: '7 12 * * 1-5'
      timezone: America/New_York
    - cron: '7 15 * * 1-5'
      timezone: America/New_York

permissions:
  contents: read
  actions: read

# Serialize all alert runs so they do not overwrite each other's state.
concurrency:
  group: growth-alerts
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Restore alert history and fundamental cache
        if: github.event_name == 'schedule' || inputs.mode != 'demo'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python scripts/restore_state.py
      - name: Scan and notify
        id: scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          RUN_MODE: ${{ github.event_name == 'schedule' && 'auto' || inputs.mode }}
          DRY_RUN: ${{ inputs.dry_run }}
        shell: bash
        run: |
          args=(--mode "$RUN_MODE")
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          python main.py "${args[@]}"
      - name: Record installed versions
        if: always()
        run: |
          mkdir -p output
          python -m pip freeze > output/installed_versions.txt
      - name: Add run summary
        if: always()
        shell: bash
        run: |
          if [ -f output/summary.md ]; then cat output/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Save reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: growth-alert-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/
          retention-days: 30
          if-no-files-found: ignore
      - name: Preserve state for the next run
        if: always() && (steps.scan.outcome == 'success' || steps.scan.outcome == 'failure') && inputs.mode != 'demo' && inputs.dry_run != true && hashFiles('state/state.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: growth-alert-state
          overwrite: true
          path: state/
          retention-days: 90
          if-no-files-found: ignore
