model: quant-signals-v2.0.0
calendar: XNYS
schedule:
  earliest_minutes_before: 65
  latest_minutes_before: 10
  daily_close_grace_minutes: 20
provider:
  batch_size: 12
  threads: 2
  pause_seconds: 1.0
  individual_retry_limit: 8
  daily_period: 2y
  intraday_period: 1mo
  timeout_seconds: 20
  save_input_snapshots: true
quality:
  min_daily_bars: 100
  completeness_window: 120
  min_completeness: 0.98
  min_price: 5.0
  min_average_dollar_volume: 10000000
  min_universe_fraction: 0.50
  min_universe_count: 3
  max_intraday_age_minutes: 25
  split_cooldown_sessions: 5
alerts:
  max_signals: 8
  max_per_ticker: 2
  cooldown_hours: 48
  send_empty_summary: true
  allow_bearish: true
signals:
  divergence:
    enabled: true
    rsi_period: 14
    pivot_left: 3
    pivot_right: 3
    min_pivot_gap: 5
    max_pivot_gap: 45
    max_confirmation_age: 2
    min_price_change: 0.005
    min_rsi_difference: 5.0
    bullish_rsi_max: 40.0
    bearish_rsi_min: 60.0
  breakout:
    enabled: true
    lookback: 20
    buffer: 0.001
    min_rvol: 1.5
    min_range_position: 0.70
    squeeze_lookback: 120
    squeeze_percentile: 0.20
  relative_strength:
    enabled: true
    lookback: 63
    return_window: 20
    min_excess_return: 0.03
    trend_window: 50
  intraday_breakout:
    enabled: true
    interval_minutes: 15
    min_elapsed_minutes: 60
    prior_sessions: 20
    min_comparable_sessions: 8
    min_rvol: 1.5
    min_range_position: 0.75
    require_above_vwap: true
relationships:
  correction: fdr_by
  # Candidate list is fixed in universe.yaml, not selected from today's winners.
  pairs:
    enabled: true
    formation_sessions: 252
    validation_sessions: 63
    max_adjusted_p: 0.05
    i1_level_min_p: 0.05
    diff_stationarity_max_p: 0.05
    validation_adf_max_p: 0.10
    half_life_min: 2.0
    half_life_max: 45.0
    max_beta_drift: 0.35
    min_validation_std_ratio: 0.5
    max_validation_std_ratio: 2.0
    entry_z: 2.0
    max_z: 3.5
  lead_lag:
    enabled: true
    initial_train: 252
    validation_sessions: 63
    max_adjusted_p: 0.05
    min_oos_mse_improvement: 0.02
    min_oos_correlation: 0.10
    min_positive_coefficient_fraction: 0.80
    min_leader_return: 0.02
    min_predicted_return: 0.005
    min_incremental_return: 0.003
    hac_lags: 5
